name: SubSeal core regression

on:
  push:
    branches:
      - architecture/**
    paths:
      - "contentserver/CSharp/Server/Leases.cs"
      - "contentserver/CSharp/Server/Wire/**"
      - "Tests/SubSealCore/**"
      - ".github/workflows/subseal-core.yml"
  pull_request:
    paths:
      - "contentserver/CSharp/Server/Leases.cs"
      - "contentserver/CSharp/Server/Wire/**"
      - "Tests/SubSealCore/**"
      - ".github/workflows/subseal-core.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Verify mirrored client/server protocol
        run: cmp contentserver/CSharp/Server/Wire/Protocol.cs contentclient/CSharp/Client/Wire/Protocol.cs
      - name: Build and execute production-source lease and crypto tests
        run: dotnet run --project Tests/SubSealCore/SubSealCore.csproj --configuration Release
