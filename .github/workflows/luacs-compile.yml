name: LuaCs CSharp compile
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  runner-diagnostics:
    runs-on: ubuntu-latest
    steps:
      - name: Runner information
        run: |
          uname -a
          echo "Runner operational"
          dotnet --info
  compile:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - module: PrimaryPackage
            target: Client
            folders: CSharp/Shared CSharp/Client
            assembly: Barotrauma.dll
          - module: PrimaryPackage
            target: Server
            folders: CSharp/Shared CSharp/Server
            assembly: DedicatedServer.dll
          - module: contentclient
            target: Client
            folders: contentclient/CSharp/Client
            assembly: Barotrauma.dll
          - module: contentserver
            target: Server
            folders: contentserver/CSharp/Server
            assembly: DedicatedServer.dll
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Fetch LuaCs publicized reference assemblies
        shell: bash
        run: |
          curl --fail --location --retry 3 -o /tmp/luacs-refs.zip https://github.com/evilfactory/LuaCsForBarotrauma/releases/download/latest/luacsforbarotrauma_refs.zip
          mkdir -p /tmp/luacs-refs
          unzip -q /tmp/luacs-refs.zip -d /tmp/luacs-refs
          find /tmp/luacs-refs -maxdepth 3 -type f -name '*.dll' | head -30
          find /tmp/luacs-refs -name '*.dll' | wc -l
      - name: Compile separate LuaCs target
        id: compilation
        shell: bash
        env:
          MODULE: ${{ matrix.module }}
          TARGET: ${{ matrix.target }}
          FOLDERS: ${{ matrix.folders }}
          ASSEMBLY: ${{ matrix.assembly }}
        run: |
          set -o pipefail
          python3 - <<'PY'
          import os, pathlib, xml.etree.ElementTree as ET
          from xml.sax.saxutils import escape
          target = os.environ["TARGET"]
          assembly = os.environ["ASSEMBLY"]
          root = pathlib.Path("/tmp/luacs-refs")
          game = next((p for p in root.rglob(assembly) if "linux" in str(p).lower()), None)
          if game is None:
              raise SystemExit("Missing Linux " + assembly + " in LuaCs refs")
          refs_dir = game.parent
          files = []
          for folder in os.environ["FOLDERS"].split():
              files += sorted(pathlib.Path(folder).rglob("*.cs"))
          if not files:
              raise SystemExit("No source files discovered")
          all_refs = sorted(refs_dir.glob("*.dll"))
          if not all_refs:
              raise SystemExit("No reference assemblies found")
          project = pathlib.Path("obj/luacs-ci") / os.environ["MODULE"] / target
          project.mkdir(parents=True, exist_ok=True)
          symbols = "CLIENT" if target == "Client" else "SERVER"
          references = "".join(f'<Reference Include="{escape(p.stem)}"><HintPath>{escape(str(p))}</HintPath></Reference>' for p in all_refs)
          includes = "".join(f'<Compile Include="{escape(str(p.resolve()))}" />' for p in files)
          xml = f'<Project Sdk="Microsoft.NET.Sdk"><PropertyGroup><TargetFramework>net8.0</TargetFramework><EnableDefaultCompileItems>false</EnableDefaultCompileItems><Nullable>disable</Nullable><LangVersion>latest</LangVersion><DefineConstants>{symbols}</DefineConstants><GenerateAssemblyInfo>false</GenerateAssemblyInfo></PropertyGroup><ItemGroup>{references}{includes}</ItemGroup></Project>'
          (project / "Compile.csproj").write_text(xml)
          print(f"Compiling {len(files)} sources for {os.environ['MODULE']} {target}")
          PY
          set +e
          dotnet build "obj/luacs-ci/$MODULE/$TARGET/Compile.csproj" -c Release --nologo -v normal 2>&1 | tee compilation.log
          result=${PIPESTATUS[0]}
          echo "exit_code=$result" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Publish compiler diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compile-${{ matrix.module }}-${{ matrix.target }}
          path: compilation.log
          if-no-files-found: warn
      - name: Enforce compile success
        if: always()
        shell: bash
        run: |
          test "${{ steps.compilation.outputs.exit_code }}" = "0" 2>&1 | tee "$RUNNER_TEMP/compile-$MODULE-$TARGET.log"
      - name: Save compiler diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compiler-${{ matrix.module }}-${{ matrix.target }}
          path: ${{ runner.temp }}/compile-*.log
          if-no-files-found: warn
